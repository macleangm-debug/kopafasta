name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact Git SHA to deploy to staging.kopafasta.com
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    environment:
      name: staging
      url: https://staging.kopafasta.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
      - name: Deploy exact SHA
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_COMMIT: ${{ github.event.inputs.commit }}
        run: |
          test -n "$STAGING_HOST"
          STAGING_HOST="$STAGING_HOST" DEPLOY_COMMIT="$DEPLOY_COMMIT" ./scripts/deploy-staging.sh
