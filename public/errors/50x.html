<!doctype html>
<html lang="sw" translate="no" class="notranslate">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Huduma haipatikani · Kopafasta</title>
    <link rel="icon" href="/images/brand/kopafasta-mark.png" type="image/png">
    <style>
        :root { --brand:#0b3d2e; --gold:#f5c842; --paper:#faf8f5; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--paper); color:#111; display:flex; flex-direction:column; }
        header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.25rem; }
        header img { height:28px; }
        .locale button { font-size:12px; font-weight:700; color:var(--brand); background:none; border:0; cursor:pointer; margin-left:8px; }
        main { flex:1; display:grid; place-items:center; padding:1.5rem; }
        .card { width:100%; max-width:32rem; background:#fff; border-radius:1.5rem; padding:2rem 1.5rem; box-shadow:0 12px 40px rgba(11,61,46,.08); border:1px solid rgba(11,61,46,.08); }
        .badge { display:inline-flex; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--brand); background:#e8f3ee; border-radius:999px; padding:.35rem .7rem; }
        h1 { font-size:1.6rem; line-height:1.2; margin:.85rem 0 .5rem; }
        p { color:#4b5563; margin:0 0 1.25rem; }
        .actions { display:flex; flex-direction:column; gap:.6rem; }
        a.btn { display:block; text-align:center; text-decoration:none; font-weight:700; border-radius:12px; padding:.9rem 1rem; }
        a.primary { background:var(--gold); color:var(--brand); }
        a.ghost { background:#fff; color:var(--brand); border:1px solid rgba(11,61,46,.18); }
        footer { text-align:center; font-size:11px; color:#9ca3af; padding:1rem; }
        @media (min-width:640px) { .actions { flex-direction:row; } a.btn { flex:1; } h1 { font-size:2rem; } }
        [data-lang="en"] { display:none; }
        html[lang="en"] [data-lang="sw"] { display:none; }
        html[lang="en"] [data-lang="en"] { display:block; }
        html[lang="en"] .actions [data-lang="en"] { display:flex; }
    </style>
</head>
<body>
    <header>
        <a href="/"><img src="/images/brand/kopafasta-logo.png" alt="Kopafasta"></a>
        <div class="locale">
            <button type="button" onclick="document.documentElement.lang='sw'">SW</button>
            <button type="button" onclick="document.documentElement.lang='en'">EN</button>
        </div>
    </header>
    <main>
        <div class="card">
            <span class="badge">Kopafasta</span>
            <h1 data-lang="sw">Huduma haipatikani kwa muda</h1>
            <h1 data-lang="en">Service temporarily unavailable</h1>
            <p data-lang="sw">Samahani, huduma haipatikani kwa muda. Tafadhali jaribu tena baada ya muda mfupi.</p>
            <p data-lang="en">Sorry, this service is temporarily unavailable. Please try again shortly.</p>
            <div class="actions">
                <a class="btn ghost" href="javascript:location.reload()" data-lang="sw">Jaribu tena</a>
                <a class="btn ghost" href="javascript:location.reload()" data-lang="en">Try again</a>
                <a class="btn primary" href="/" data-lang="sw">Nyumbani</a>
                <a class="btn primary" href="/" data-lang="en">Home</a>
            </div>
        </div>
    </main>
    <footer>Kopafasta</footer>
    <script>
        (function () {
            try {
                var q = new URLSearchParams(location.search).get('lang');
                if (q === 'en' || q === 'sw') document.documentElement.lang = q;
            } catch (e) {}
        })();
    </script>
</body>
</html>
